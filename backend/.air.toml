root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g routes/routes.go -o docs --quiet && GOTOOLCHAIN=local go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs", "storage"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
