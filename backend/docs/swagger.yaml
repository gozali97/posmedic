          $ref: '#/definitions/dto.CartLineRequest'
        minItems: 1
        type: array
      prescription_note:
        maxLength: 500
        type: string
      prescription_number:
        maxLength: 50
        type: string
      ref_number:
        maxLength: 50
        type: string
      till_id:
        type: integer
    required:
    - items
    type: object
  dto.LoginData:
    properties:
      access_token:
        type: string
      expires_in:
        example: 43200
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
