      filters:
        $ref: '#/definitions/dto.SearchFilters'
      pagination:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.CustomerRequest:
    properties:
      address:
        maxLength: 500
        type: string
      email:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        type: string
      phone:
        maxLength: 30
        type: string
    required:
    - name
    type: object
  dto.HeldItem:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      creator_name:
        type: string
      customer_id:
        type: integer
      customer_name:
        type: string
      id:
        type: integer
      item_count:
        type: integer
      ref_number:
        type: string
      till_id:
        type: integer
      total:
        type: integer
    type: object
  dto.HeldListData:
    properties:
      pagination:
        $ref: '#/definitions/dto.PaginationMeta'
      transactions:
        items:
          $ref: '#/definitions/dto.HeldItem'
        type: array
    type: object
  dto.HeldUpdateRequest:
    properties:
      customer_id:
        type: integer
      discount:
