info:
  contact: {}
  description: API POS apotek. Semua respons memakai envelope {status, code, message,
    data}.
  title: POS Apotek API
  version: "1.0"
paths:
  /alerts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AlertsData'
              type: object
      security:
      - BearerAuth: []
      summary: 'Peringatan: batch ED, hampir ED, stok menipis/habis, hutang jatuh
        tempo (perm_purchases)'
      tags:
      - Alerts
  /audit-logs:
    get:
      parameters:
      - description: ID user pelaku
        in: query
        name: user_id
        type: integer
      - description: Entitas, mis. user, till, store_settings
        in: query
        name: entity_type
        type: string
      - description: Aksi, mis. login, login_failed, update
        in: query
        name: action
        type: string
      - description: YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: YYYY-MM-DD (inklusif)
        in: query
        name: end_date
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Per halaman (maks 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuditLogListData'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar audit log (hanya baca)
      tags:
      - Audit Log
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Login dengan username dan password
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Logout dan batalkan sesi
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
      security:
      - BearerAuth: []
      summary: Data user yang sedang login
      tags:
      - Auth
  /auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Password lama dan baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Ganti password sendiri
      tags:
      - Auth
  /auth/profile:
    put:
      consumes:
      - application/json
      parameters:
      - description: Nama lengkap
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
      security:
      - BearerAuth: []
      summary: Ubah nama sendiri
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Tukar refresh token dengan access token baru
      tags:
      - Auth
  /batches:
    get:
      parameters:
      - description: Produk
        in: query
        name: product_id
        type: integer
      - description: Rak
        in: query
        name: shelf_location
        type: string
      - description: Nama produk / no. batch
        in: query
        name: search
        type: string
      - description: expired | 30 | warning
        in: query
        name: expiry_status
        type: string
      - description: 1 (default) = hanya berstok, 0 = semua
        in: query
        name: in_stock
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BatchListData'
              type: object
      security:
      - BearerAuth: []
      summary: Stok per batch
      tags:
      - Batches
  /batches/{id}/adjustment:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID batch
        in: path
        name: id
        required: true
        type: integer
      - description: Penyesuaian
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdjustmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ProductBatch'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Penyesuaian stok per batch (+/-) dengan alasan
      tags:
      - Batches
  /batches/export:
    get:
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export stok per batch ke Excel
      tags:
      - Batches
  /categories:
    get:
      parameters:
      - description: Cari nama
        in: query
        name: search
        type: string
      - description: 1 = semua tanpa paginasi
        in: query
        name: all
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryListData'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar kategori (all=1 untuk dropdown tanpa paginasi)
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Kategori
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Tambah kategori
      tags:
      - Categories
  /categories/{id}:
    delete:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Hapus kategori (ditolak jika masih dipakai produk)
      tags:
      - Categories
    put:
      consumes:
      - application/json
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      - description: Kategori
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
      security:
      - BearerAuth: []
      summary: Ubah kategori
      tags:
      - Categories
  /customers:
    get:
      parameters:
      - description: Cari nama/telepon
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CustomerListData'
              type: object
