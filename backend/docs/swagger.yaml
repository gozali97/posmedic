        type: string
      id:
        type: integer
      name:
        type: string
      product_count:
        type: integer
      updated_at:
        type: string
    type: object
  dto.CategoryListData:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.CategoryItem'
