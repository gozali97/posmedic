      reason:
        type: string
    required:
    - note
    - quantity
    - reason
    type: object
  dto.AlertBatch:
    properties:
      batch_number:
        type: string
      expiration_date:
        $ref: '#/definitions/models.Date'
      id:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
    type: object
  dto.AlertCounts:
    properties:
      expired_batches:
        type: integer
      low_stock:
        type: integer
      near_expiry_batches:
        type: integer
      out_of_stock:
        type: integer
      payables_due:
        type: integer
    type: object
  dto.AlertPayable:
    properties:
      due_date:
        $ref: '#/definitions/models.Date'
      id:
        type: integer
      invoice_number:
        type: string
      supplier_name:
        type: string
      total:
        type: integer
    type: object
  dto.AlertProduct:
    properties:
      id:
        type: integer
      min_stock:
        type: integer
      name:
        type: string
      sellable_stock:
        type: integer
