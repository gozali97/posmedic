  dto.AlertsData:
    properties:
      counts:
        $ref: '#/definitions/dto.AlertCounts'
      expired_batches:
        items:
          $ref: '#/definitions/dto.AlertBatch'
        type: array
      low_stock:
        items:
          $ref: '#/definitions/dto.AlertProduct'
        type: array
      near_expiry_batches:
        items:
          $ref: '#/definitions/dto.AlertBatch'
        type: array
      out_of_stock:
        items:
          $ref: '#/definitions/dto.AlertProduct'
        type: array
      payables_due:
        items:
          $ref: '#/definitions/dto.AlertPayable'
        type: array
    type: object
  dto.AuditLogItem:
    properties:
      action:
        type: string
      after:
        type: object
      before:
        type: object
      created_at:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      id:
        type: integer
      ip:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.AuditLogListData:
    properties:
      audit_logs:
        items:
          $ref: '#/definitions/dto.AuditLogItem'
